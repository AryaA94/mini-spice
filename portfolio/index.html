<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects</title>
  <meta name="description" content="Electrical hardware and software projects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="probe" aria-hidden="true"><span class="probe-ring"></span><span class="probe-readout"></span></div>

  <header class="nav">
    <a class="mark" href="#top" data-magnetic><span class="mark-dot"></span><span id="nav-name"></span></a>
    <nav class="nav-links">
      <a href="#work" data-magnetic>Work</a>
      <a href="#about" data-magnetic>About</a>
      <a href="#contact" data-magnetic>Contact</a>
    </nav>
    <div class="nav-meta mono">
      <span class="live"><i></i><span id="clock">--:--</span></span>
      <button class="theme-btn" id="theme-btn" aria-label="Toggle light / dark theme" data-magnetic>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v10" stroke="currentColor" stroke-width="1.6"/><path d="M12 7a5 5 0 0 1 0 10z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main id="top">
    <!-- HERO -->
    <section class="hero">
      <canvas id="traces" aria-hidden="true"></canvas>
      <div class="hero-inner">
        <p class="eyebrow mono reveal"><span class="pin">U1</span> <span id="hero-role"></span></p>
        <h1 class="hero-title" id="hero-title" aria-label=""></h1>
        <p class="hero-intro reveal" id="hero-intro"></p>
        <div class="hero-ctas reveal">
          <a class="btn btn-solid" href="#work" data-magnetic>See the work <span aria-hidden="true">↓</span></a>
          <a class="btn btn-ghost" href="#contact" data-magnetic>Get in touch</a>
        </div>
      </div>
      <dl class="hero-stats mono reveal" id="hero-stats"></dl>
      <div class="scope mono reveal" aria-hidden="true">
        <div class="scope-head"><span>CH1</span><span id="scope-freq">— Hz</span></div>
        <svg viewBox="0 0 200 60" preserveAspectRatio="none"><path id="scope-path" d=""/></svg>
        <div class="scope-foot"><span>move the cursor</span><span id="scope-v">0.00 V</span></div>
      </div>
    </section>

    <!-- WORK -->
    <section class="work" id="work">
      <div class="work-head">
        <div>
          <p class="eyebrow mono reveal"><span class="pin">02</span> Selected work</p>
          <h2 class="section-title reveal">Things I've <em>built</em></h2>
        </div>
        <div class="controls reveal">
          <div class="switch" role="tablist" aria-label="Filter projects">
            <span class="switch-thumb" aria-hidden="true"></span>
            <button role="tab" data-filter="all" aria-selected="true">All <sup class="mono" data-count="all"></sup></button>
            <button role="tab" data-filter="hardware" aria-selected="false">Hardware <sup class="mono" data-count="hardware"></sup></button>
            <button role="tab" data-filter="software" aria-selected="false">Software <sup class="mono" data-count="software"></sup></button>
          </div>
          <div class="view-toggle mono" role="group" aria-label="Layout">
            <button data-view="grid" aria-pressed="true" title="Grid view">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1" y="1" width="6" height="6"/><rect x="9" y="1" width="6" height="6"/><rect x="1" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/></svg>
            </button>
            <button data-view="index" aria-pressed="false" title="Index view">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1" y="2" width="14" height="2"/><rect x="1" y="7" width="14" height="2"/><rect x="1" y="12" width="14" height="2"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="projects" id="projects" data-view="grid"></div>
      <div class="hover-preview" aria-hidden="true"><div class="hover-preview-inner"></div></div>
    </section>

    <!-- ABOUT -->
    <section class="about" id="about">
      <p class="eyebrow mono reveal"><span class="pin">03</span> About</p>
      <div class="about-grid">
        <p class="about-lead reveal" id="about-lead"></p>
        <div class="about-cols reveal">
          <div>
            <h3 class="mono">Hardware</h3>
            <ul id="skills-hw"></ul>
          </div>
          <div>
            <h3 class="mono">Software</h3>
            <ul id="skills-sw"></ul>
          </div>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section class="contact" id="contact">
      <p class="eyebrow mono reveal"><span class="pin">04</span> Contact</p>
      <a class="contact-big reveal" id="contact-email" href="#" data-magnetic></a>
      <div class="contact-row reveal">
        <ul class="contact-links mono" id="contact-links"></ul>
        <p class="mono muted" id="contact-loc"></p>
      </div>
    </section>
  </main>

  <!-- PROJECT DETAIL -->
  <div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
    <div class="detail-scrim" data-close></div>
    <article class="detail-panel" tabindex="-1">
      <div class="detail-bar mono">
        <button class="detail-close" data-close data-magnetic>← Back</button>
        <span id="detail-crumb"></span>
        <div class="detail-nav">
          <button id="detail-prev" aria-label="Previous project" data-magnetic>↑</button>
          <button id="detail-next" aria-label="Next project" data-magnetic>↓</button>
        </div>
      </div>
      <div class="detail-body" id="detail-body"></div>
    </article>
  </div>

  <script src="projects.js"></script>
  <script src="app.js"></script>
</body>
</html>
