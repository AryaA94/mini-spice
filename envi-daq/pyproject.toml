[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envi-daq"
version = "1.0.0"
description = "Download, verify and track telemetry sessions from Wi-Fi environmental data loggers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # stdlib only: urllib, sqlite3, tomllib, http.server

[project.scripts]
envi-daq = "envi_daq.cli:main"

[tool.setuptools]
packages = ["envi_daq"]
